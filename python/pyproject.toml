[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-reto02"
version = "1.0.0"
description = "CLI local con Vigenère y AES-256-GCM en contenedores R2AE"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["cryptography==50.0.2"]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[project.scripts]
enigma = "enigma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["acceptance: archivos de 1 MiB y 20 MiB"]

[tool.coverage.run]
source = ["enigma"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

